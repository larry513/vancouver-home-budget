<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe0f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vancouver Home">
<title>Vancouver Home Budget · 温哥华家庭预算</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232e7d5b'/%3E%3Cpath d='M32 10l4 10 8-4-2 10 9 2-8 6 3 8-9-3-1 12h-8l-1-12-9 3 3-8-8-6 9-2-2-10 8 4z' fill='%23e5673f'/%3E%3C/svg%3E">
<style>
:root{--ink:#2b2a33;--muted:#6d6a76;--glass:rgba(255,255,255,.76);--glass2:rgba(255,255,255,.58);--line:rgba(70,55,40,.12);--pri:#2e7d5b;--pri2:#3fa173;--acc:#e5673f;--acc2:#f08a5d;--amber:#d98b06;--amberbg:#fff3d6;--red:#d23535;--redbg:#ffe3e0;--green:#2a9258;--greenbg:#e2f5e8;--blue:#3a78b5;--r:18px;--shadow:0 6px 24px rgba(70,45,20,.12);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;color:var(--ink);background:linear-gradient(180deg,#c4e3f3 0%,#e8f2f0 35%,#fbf0e2 100%) fixed;min-height:100vh;-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.zh{color:var(--muted);font-weight:400;font-size:.88em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.neg{color:var(--red)!important}
.pos{color:var(--green)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.bgdeco{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:-1;opacity:.28;pointer-events:none;width:100%}
/* hero */
.hero{position:relative;height:calc(250px + var(--sat));overflow:hidden;border-radius:0 0 26px 26px;box-shadow:0 8px 30px rgba(40,60,90,.15)}
.hero svg.scene{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.topbar{position:absolute;top:calc(10px + var(--sat));left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:5}
.brand{background:var(--glass2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:6px 12px 7px;border-radius:14px;border:1px solid rgba(255,255,255,.6);min-width:0}
.brand h1{font-size:16px;margin:0;line-height:1.2;letter-spacing:.2px}
.brand h1 .bleaf{color:var(--acc)}
.brand h1 .full{display:none}
@media (min-width:760px){.brand h1 .full{display:inline}.brand h1 .short{display:none}}
.brand .sub{font-size:11.5px;color:var(--muted)}
.scenechip{display:inline-block;margin-top:3px;font-size:11px;background:rgba(255,255,255,.85);border-radius:10px;padding:1px 8px}
.monthsel{display:flex;align-items:center;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:2px;border:1px solid rgba(255,255,255,.6);flex-shrink:0}
.monthsel button{background:none;border:0;width:36px;height:40px;font-size:20px;border-radius:10px;color:var(--pri)}
.monthsel button:active{background:rgba(0,0,0,.06)}
.monthsel label{position:relative;display:block;text-align:center;min-width:78px;font-weight:700;font-size:14px;line-height:1.1;padding:3px 2px}
.monthsel label small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.monthsel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
main{padding:12px 12px calc(96px + var(--sab));position:relative;z-index:4;max-width:1560px;margin:0 auto}
.card{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card h3 .right,.card h2 .right{margin-left:auto}
.linkbtn{background:none;border:0;color:var(--pri);font-weight:600;padding:6px 4px;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--line)}
.btn.pri{background:var(--pri);color:#fff;border-color:transparent}
.btn.acc{background:var(--acc);color:#fff;border-color:transparent}
.btn.danger{background:#fff;color:var(--red);border-color:#f2c2bd}
.btn.dangerfill{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn-add{width:100%;margin-top:12px;min-height:56px;font-size:18px;letter-spacing:.5px;border-radius:16px;background:linear-gradient(135deg,var(--acc),#f29a54);color:#fff;border:0;font-weight:800;box-shadow:0 6px 16px rgba(229,103,63,.35)}
.btn-add:active{transform:scale(.98)}
/* KPI */
.kpi .avail label{font-size:13px;color:var(--muted)}
.kpi .big{font-size:38px;font-weight:800;letter-spacing:-.5px;line-height:1.1;color:var(--pri)}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:rgba(255,255,255,.7);border-radius:14px;padding:10px 12px;border:1px solid var(--line);text-align:left;width:100%}
.tile label{display:block;font-size:12px;color:var(--muted)}
.tile b{font-size:20px;display:block}
.tile small{font-size:11.5px;color:var(--muted)}
button.tile{cursor:pointer}
.onboard{background:linear-gradient(135deg,rgba(255,247,230,.92),rgba(255,236,220,.9));border:1px solid #f6d1b3}
.onboard p{margin:6px 0 10px}
/* flow */
.stack{display:flex;height:16px;border-radius:9px;overflow:hidden;background:#e9ecef;margin:4px 0 6px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-bottom:8px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;background:var(--c)}
.flow{display:flex;flex-direction:column;align-items:stretch}
.fstep{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.8);border:1px solid var(--line)}
.fstep .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--bg)}
.fstep .t{font-weight:700;font-size:14px;line-height:1.2}
.fstep .d{font-size:11.5px;color:var(--muted)}
.fstep .v{text-align:right;font-weight:800;font-size:17px}
.fstep .v small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.fstep.fund{--bg:#dff1e7}
.fstep.fixed{--bg:#e3ecf8}
.fstep.var{--bg:#fdeedd}
.fstep.avail{--bg:#e6f6ec;background:linear-gradient(135deg,#f1fbf4,#fff);border-color:#bfe3cc}
.farrow{display:flex;align-items:center;gap:8px;padding:2px 0 2px 26px;color:var(--muted);font-size:12px;height:24px}
.farrow::before{content:"";width:2px;height:100%;background:linear-gradient(var(--pri2),transparent);margin-right:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12.5px}
.chip.warn{background:var(--amberbg);border-color:#f3d48f}
.chip.over{background:var(--redbg);border-color:#f2b6b0}
.tip{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#e7e2da;color:#6b5f50;font-size:11px;font-weight:700;cursor:help;border:0;padding:0;vertical-align:middle}
.tip .tipbox{display:none;position:absolute;z-index:30;bottom:24px;right:-10px;width:260px;background:#2f2c35;color:#fff;font-weight:400;font-size:12px;line-height:1.45;padding:10px 12px;border-radius:12px;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tip:hover .tipbox,.tip:focus .tipbox,.tip.open .tipbox{display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px;margin-top:10px}
.kv div:nth-child(even){text-align:right;font-weight:700}
/* progress */
.prow{padding:8px 0;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow .top{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.prow .top .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .bot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:3px}
.bar{height:9px;background:#e9ecef;border-radius:6px;overflow:hidden;margin-top:5px;position:relative}
.bar i{display:block;height:100%;border-radius:6px;background:var(--green);max-width:100%}
.bar.warn i{background:var(--amber)}
.bar.over i{background:var(--red)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 5px;vertical-align:middle;line-height:1.5}
.badge.A{background:#e1efe7;color:#226b48}
.badge.B{background:#e6edf9;color:#2f5f9c}
.badge.C{background:#f6e8f3;color:#8a3c7a}
.badge.warn{background:var(--amberbg);color:#9a6200}
.badge.over{background:var(--redbg);color:var(--red)}
.badge.reimb{background:#ece6fb;color:#5b3fb0}
.badge.split{background:#fff0e0;color:#b45f12}
/* expenses list */
.eitem.more5{display:none}
@media (min-width:1024px){.eitem.more5{display:grid}}
.elist{list-style:none;margin:0;padding:0}
.eitem{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.eitem:hover{background:rgba(255,255,255,.6)}
.eitem:last-child{border-bottom:0}
.eitem .ic{width:36px;height:36px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:18px;border:1px solid var(--line)}
.eitem .m{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eitem .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eitem .a{font-weight:800;text-align:right}
.eitem .a small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:13.5px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 4px calc(4px + var(--sab))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;font-size:11px;color:var(--muted);border-radius:12px}
.nav button .i{font-size:21px;line-height:1}
.nav button.on{color:var(--pri);font-weight:700}
.nav button.on .i{transform:scale(1.08)}
.nav button.addnav .i{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#f29a54);color:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 6px 14px rgba(229,103,63,.45);border:3px solid #fff}
.nav button.addnav{color:var(--acc);font-weight:700}
.fab{display:none;position:fixed;right:26px;bottom:26px;z-index:41;border:0;border-radius:30px;height:60px;padding:0 24px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--acc),#f29a54);box-shadow:0 10px 24px rgba(229,103,63,.45)}
/* forms */
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;border:1px solid #d9d4cc;border-radius:12px;padding:9px 12px;background:#fff;font-size:16px;outline:none}
.inp:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(63,161,115,.18)}
textarea.inp{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amtwrap{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #d9d4cc;border-radius:16px;padding:6px 14px;margin-bottom:12px}
.amtwrap:focus-within{border-color:var(--acc)}
.amtwrap .cur{font-size:28px;font-weight:700;color:var(--muted)}
.amtwrap input{border:0;outline:none;font-size:36px;font-weight:800;width:100%;min-width:0;background:transparent;padding:4px 0}
.amtwrap .code{font-size:13px;color:var(--muted);font-weight:700}
.seg{display:flex;background:#efebe5;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font-size:13px;padding:4px 6px;line-height:1.15}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:700;color:var(--pri)}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #d9d4cc;min-height:44px;cursor:pointer;margin-bottom:10px}
.check input{width:20px;height:20px;accent-color:var(--pri)}
.live{border-radius:16px;padding:12px;margin:12px 0;background:#f5f7f6;border:1px solid var(--line)}
.live .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.live .g div{background:#fff;border-radius:10px;padding:7px 10px}
.live .g label{display:block;font-size:11px;color:var(--muted)}
.live .g b{font-size:16px}
.live .status{margin-top:10px;border-radius:12px;padding:10px 12px;font-weight:800;font-size:15px;text-align:center}
.live .status.ok{background:var(--greenbg);color:var(--green)}
.live .status.warn{background:var(--amberbg);color:#9a6200}
.live .status.over{background:var(--red);color:#fff;font-size:22px;letter-spacing:.5px}
.live .status.info{background:#ece6fb;color:#5b3fb0;font-weight:600;font-size:13.5px}
.live .ln{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.live .ln:last-child{border-bottom:0}
.splitrow{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;align-items:center;margin-bottom:6px}
.splitrow .inp{min-height:42px;font-size:15px;padding:8px 9px}
.splitrow .x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--red)}
.splitrow .hint{grid-column:1/-1;font-size:11.5px;margin:-2px 0 4px 4px}
.unalloc{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;font-weight:700;margin:6px 0}
.unalloc.bad{background:var(--redbg);color:var(--red)}
.unalloc.good{background:var(--greenbg);color:var(--green)}
.mini{margin:-4px 0 12px;border-radius:12px;padding:9px 12px;font-weight:800;font-size:14.5px}
.mini.over{background:var(--red);color:#fff;font-size:17px}
.mini.warn{background:var(--amberbg);color:#9a6200}
.mini.ok{background:var(--greenbg);color:var(--green);font-weight:600}
.mini.info{background:#ece6fb;color:#5b3fb0;font-weight:600}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin:4px 0}
/* modal */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(30,28,40,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fbf9f6;width:100%;max-width:620px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + var(--sab));box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .2s ease-out;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-14px;background:#fbf9f6;margin:-14px -16px 10px;padding:14px 16px 8px;z-index:3;border-bottom:1px solid var(--line)}
.sheet .sh h2{margin:0;font-size:18px}
.xbtn{width:40px;height:40px;border-radius:50%;border:0;background:#eee9e2;font-size:20px}
.sheet .foot{position:sticky;bottom:calc(-18px - var(--sab));background:#fbf9f6;padding:10px 0 4px;margin-top:6px;display:flex;gap:8px;border-top:1px solid var(--line)}
.sheet .foot .btn{flex:1;min-height:50px;font-size:16px}
#confirmLayer .modal-back{z-index:80;align-items:center;padding:20px}
.dialog{background:#fff;border-radius:20px;padding:18px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h3{margin:0 0 8px}
.dialog p{margin:0 0 14px;color:var(--muted);white-space:pre-line}
.dialog .btnrow .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:#2f2c35;color:#fff;padding:10px 16px;border-radius:14px;z-index:90;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center;animation:fade .2s}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.grp td{font-weight:700;background:rgba(255,255,255,.55)}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.minibar{width:70px;height:7px;background:#e9ecef;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}
.minibar i{display:block;height:100%;background:var(--green)}
.minibar.warn i{background:var(--amber)}.minibar.over i{background:var(--red)}
/* budget editor */
.bl{border-bottom:1px solid var(--line);padding:9px 0}
.bl:last-child{border-bottom:0}
.bl .r1{display:grid;grid-template-columns:1fr 112px 38px;gap:8px;align-items:center}
.bl .r1 .inp{min-height:40px;font-size:15px;padding:7px 10px}
.bl .r1 .amt{text-align:right;font-weight:700}
.bl .gear{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff}
.bl .r2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:5px;flex-wrap:wrap}
.bl .r2 .bar{flex:1;min-width:90px;margin:0}
.bl .ed{display:none;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;background:rgba(255,255,255,.6);padding:8px;border-radius:12px}
.bl.open .ed{display:grid}
.bl .ed select{min-height:38px;font-size:14px;padding:6px 8px}
.bl .ed .acts{grid-column:1/-1;display:flex;gap:6px}
.secthead{display:flex;align-items:center;justify-content:space-between;margin:12px 0 2px;font-weight:800;font-size:14px;color:var(--pri)}
.oreo-prompt{display:flex;align-items:center;gap:10px;background:#fff7ec;border:1px dashed #e9b77d;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.oreo-prompt .btn{margin-left:auto}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat label{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-size:19px}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:#6d6a76;font-family:inherit}
@media (max-width:700px){.chart text{font-size:18px}}
pre.summary,textarea.summary{width:100%;white-space:pre-wrap;font-family:inherit;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:300px;line-height:1.5}
.view{display:none}
.view.on{display:block}
.m-only{}
.d-only{display:none!important}
.home-grid>.col{min-width:0}
.listmore{display:none}

<script>
/* ===================== SCENE (inline SVG, generated) ===================== */
var Scene = (function(){
  'use strict';
  function pad(n){return (n<10?'0':'')+n;}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function addDays(d,k){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+k);return x;}
  function between(t,a,b){return t>=ymd(a)&&t<=ymd(b);}
  function nthWeekday(y,m0,wd,n){var d=new Date(y,m0,1);var off=(wd-d.getDay()+7)%7;return new Date(y,m0,1+off+(n-1)*7);}
  function victoriaDay(y){var d=new Date(y,4,24);while(d.getDay()!==1)d.setDate(d.getDate()-1);return d;}
  function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  var LUNAR_NY={2025:'2025-01-29',2026:'2026-02-17',2027:'2027-02-06',2028:'2028-01-26',2029:'2029-02-13',2030:'2030-02-03'};
  var MID_AUTUMN={2025:'2025-10-06',2026:'2026-09-25',2027:'2027-09-15',2028:'2028-10-03',2029:'2029-09-22',2030:'2030-09-12'};
  var NAMES={christmas:'🎄 Merry Christmas 圣诞快乐',newyear:'🎆 Happy New Year 新年快乐',canadaday:'🇨🇦 Happy Canada Day 加拿大日',thanksgiving:'🦃 Happy Thanksgiving 感恩节',halloween:'🎃 Happy Halloween 万圣节',valentine:'💕 Valentine’s Day 情人节',lunarnewyear:'🧧 Happy Lunar New Year 春节快乐',midautumn:'🥮 Mid-Autumn Festival 中秋快乐',victoriaday:'🌸 Victoria Day 维多利亚日',familyday:'👨‍👩‍👦‍👦 Family Day 家庭日',none:''};
  var LIST=Object.keys(NAMES);
  function detect(d){
    var y=d.getFullYear(),md=(d.getMonth()+1)*100+d.getDate(),t=ymd(d);
    if(LUNAR_NY[y]){var l=pd(LUNAR_NY[y]);if(between(t,addDays(l,-1),addDays(l,3)))return 'lunarnewyear';}
    if(md>=1227||md<=103)return 'newyear';
    if(md>=1125&&md<=1226)return 'christmas';
    if(md>=1030&&md<=1031)return 'halloween';
    var tg=nthWeekday(y,9,1,2);if(between(t,addDays(tg,-1),tg))return 'thanksgiving';

    if(md>=213&&md<=214)return 'valentine';
    var vd=victoriaDay(y);if(between(t,addDays(vd,-1),vd))return 'victoriaday';
    var fd=nthWeekday(y,1,1,3);if(between(t,addDays(fd,-1),fd))return 'familyday';

  }
  function current(){
    var q={};try{q=Object.fromEntries(new URLSearchParams(location.search));}catch(e){}
    if(q.scene&&LIST.indexOf(q.scene)>=0)return q.scene; // hidden dev override
    var d=new Date();
    if(q.date&&/^\d{4}-\d{2}-\d{2}$/.test(q.date))d=pd(q.date); // hidden dev override (scene only)
    return detect(d);
  }

  var seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}

    day:{t:'#8ccaf0',b:'#e9f5f3',sun:'#ffe7a0',m1:'#a9c0d8',m2:'#82a2c0',hill:'#55806a',w1:'#79bde0',w2:'#3e8dbd',g1:'#9bd47f',g2:'#62ad5c',ever:['#2f6f4f','#3b8259','#28603f'],crown:['#5ea94f','#78bd5a','#4c9444','#d9573c'],win:'rgba(255,255,255,.55)',city:['#cfdbe6','#b9cbdc','#dfe7ee','#a9bdd0','#c3d3e1']},
    autumn:{t:'#93cbee',b:'#fbecd6',sun:'#ffd98a',m1:'#aebfd2',m2:'#8aa1b9',hill:'#6f7f4f',w1:'#80bcd9',w2:'#4789b3',g1:'#b9c96d',g2:'#88a64c',ever:['#2f6a4c','#3a7a55','#295c40'],crown:['#e2572f','#f08a2c','#d63a2a','#f5b041'],win:'rgba(255,255,255,.5)',city:['#d6dde4','#c0ccd8','#e4e8ec','#b0c0cf','#cad5df']},
    winter:{t:'#b3d3ea',b:'#f1f6f9',sun:'#fff3c9',m1:'#c9d8e6',m2:'#a7bdd1',hill:'#7f9a8c',w1:'#9cc6dd',w2:'#5f98bd',g1:'#f4f8fb',g2:'#dde8ef',ever:['#2d6a4f','#367a59','#255c42'],crown:['#e9eef2','#dfe7ec','#f4f7f9','#cfdbe2'],win:'rgba(255,240,180,.8)',city:['#d9e2ea','#c6d3df','#e6ecf1','#b8c8d6','#cfd9e3']},

  };
  function skyFor(s){

  }

  var L=lines.map(function(l){var actual=(byLine[l.id]||0)/100,budget=r2(l.amount);return {id:l.id,name:l.name,priority:l.priority,category:l.category,type:l.type,member:l.member,budget:budget,actual:actual,remaining:r2(budget-actual),pct:budget>0?actual/budget:(actual>0?Infinity:0),st:(function(st){return st==='full'&&l.type==='Fixed'?'paid':st;})(status(budget,actual))};});
  var unl=items.filter(function(p){return !ids[p.lineId];});
  var unlinked=sum(unl.map(function(p){return p.amount;}));
  var spent=sum(items.map(function(p){return p.amount;}));
  var budget=sum(L.map(function(x){return x.budget;}));
  function sb(arr,k){return sum(arr.map(function(x){return x[k];}));}
  var F=L.filter(function(x){return x.type==='Fixed';}),V=L.filter(function(x){return x.type!=='Fixed';});
  var committed=sum(L.map(function(x){return Math.max(x.budget,x.actual);}))+unlinked;
  var byCat={},byPri={A:0,B:0,C:0},byMem={},catBudget={};
  items.forEach(function(p){byCat[p.category]=(byCat[p.category]||0)+cents(p.amount);byPri[p.priority]=(byPri[p.priority]||0)+cents(p.amount);byMem[p.member]=(byMem[p.member]||0)+cents(p.amount);});
  Object.keys(byCat).forEach(function(k){byCat[k]/=100;});Object.keys(byPri).forEach(function(k){byPri[k]/=100;});Object.keys(byMem).forEach(function(k){byMem[k]/=100;});
  L.forEach(function(x){catBudget[x.category]=r2((catBudget[x.category]||0)+x.budget);});
  var reimbPending=ritems.filter(function(p){return !p.e.reimbReceived;});
  return {m:m,exists:!!S.months[m],funds:M.funds,lines:L,fund:fund,usd:usd,fees:fees,refLoss:r2(refLoss),rate:usd>0?fund/usd:0,
    exps:exps,items:items,ritems:ritems,spent:spent,budget:budget,unlinked:unlinked,
    fixedB:sb(F,'budget'),fixedA:sb(F,'actual'),varB:sb(V,'budget'),varA:r2(sb(V,'actual')+unlinked),
    committed:r2(committed),projected:r2(fund-committed),available:r2(fund-spent),unbudgeted:r2(fund-budget),
    byCat:byCat,byPri:byPri,byMem:byMem,catBudget:catBudget,
    children:sum(items.filter(isChild).map(function(p){return p.amount;})),oreo:sum(items.filter(isOreo).map(function(p){return p.amount;})),
    reimbMonth:sum(ritems.map(function(p){return p.amount;})),reimbPendingMonth:sum(reimbPending.map(function(p){return p.amount;})),
    hasData:M.funds.length>0||exps.length>0};
}
function pendingReimb(){return S.expenses.filter(function(e){return e.reimb&&!e.reimbReceived;}).sort(function(a,b){return a.date<b.date?1:-1;});}
function lineCheck(m,lineId,amount,excludeId){
  var l=findLine(m,lineId);var budget=l?r2(l.amount):0;
  var already=0;S.expenses.forEach(function(e){if(e.reimb||e.id===excludeId||monthOf(e.date)!==m)return;parts(e).forEach(function(p){if(p.lineId===lineId)already+=cents(p.amount);});});
  already/=100;var after=r2(budget-already-amount);var used=already+amount;
  var st=budget<=0?(used>0?'over':'ok'):(used>budget+0.004?'over':(used/budget>=0.8?'warn':'ok'));
  return {line:l,budget:budget,already:already,amount:r2(amount),after:after,pct:budget>0?used/budget:(used>0?Infinity:0),st:st};
}

function knownMonths(){var set={};Object.keys(S.months).forEach(function(k){set[k]=1;});S.expenses.forEach(function(e){set[monthOf(e.date)]=1;});set[curMonth()]=1;set[ui.month]=1;return Object.keys(set).sort();}
function qOf(m){var p=m.split('-');return p[0]+'-Q'+Math.ceil(+p[1]/3);}
function periodMonths(type,key){
  if(type==='month')return [key];
  if(type==='quarter'){var y=key.slice(0,4),q=+key.slice(-1),a=[];for(var i=1;i<=3;i++)a.push(y+'-'+pad((q-1)*3+i));return a;}
  var r=[];for(var j=1;j<=12;j++)r.push(key+'-'+pad(j));return r;
}
function periodKeys(type){var ms=knownMonths(),set={};ms.forEach(function(m){set[type==='month'?m:type==='quarter'?qOf(m):m.slice(0,4)]=1;});return Object.keys(set).sort().reverse();}
function periodLabel(type,key){return type==='month'?mLabelFull(key):type==='quarter'?key.replace('-',' '):key+' 年度';}
function agg(months){
  var A={fund:0,usd:0,fees:0,refLoss:0,spent:0,budget:0,byCat:{},byPri:{A:0,B:0,C:0},byMem:{},catBudget:{},children:0,oreo:0,lines:{},fx:[],reimbAdv:0,reimbPending:0,months:[],nExp:0};
  function add(o,k,v){o[k]=r2((o[k]||0)+v);}
  months.forEach(function(m){
    var c=calc(m);if(!c.hasData)return;A.months.push(m);
    A.fund=r2(A.fund+c.fund);A.usd=r2(A.usd+c.usd);A.fees=r2(A.fees+c.fees);A.refLoss=r2(A.refLoss+c.refLoss);A.spent=r2(A.spent+c.spent);A.budget=r2(A.budget+c.budget);A.children=r2(A.children+c.children);A.oreo=r2(A.oreo+c.oreo);
    A.reimbAdv=r2(A.reimbAdv+c.reimbMonth);A.reimbPending=r2(A.reimbPending+c.reimbPendingMonth);A.nExp+=c.exps.length;
    Object.keys(c.byCat).forEach(function(k){add(A.byCat,k,c.byCat[k]);});Object.keys(c.byPri).forEach(function(k){add(A.byPri,k,c.byPri[k]);});Object.keys(c.byMem).forEach(function(k){add(A.byMem,k,c.byMem[k]);});
    Object.keys(c.catBudget).forEach(function(k){add(A.catBudget,k,c.catBudget[k]);});
    c.lines.forEach(function(x){var o=A.lines[x.name]||(A.lines[x.name]={b:0,a:0,cat:x.category,pri:x.priority});o.b=r2(o.b+x.budget);o.a=r2(o.a+x.actual);});
    if(c.unlinked>0){var u=A.lines['(unlinked)']||(A.lines['(unlinked)']={b:0,a:0,cat:'Other',pri:'B'});u.a=r2(u.a+c.unlinked);}
    c.funds.forEach(function(f){A.fx.push({m:m,date:f.date,usd:f.usd,cad:f.cad,rate:f.usd>0?f.cad/f.usd:0,fee:f.fee,feeCur:f.feeCur,ref:f.ref});});
  });

}

    case 'export-copy':showText('📋 Backup JSON 备份数据',exportJSON(),'jsonOut','<p class="small muted" style="margin-top:0">Copy and save this text somewhere safe (Notes, email to yourself). 复制并保存到备忘录或发邮件给自己。</p>');break;
    case 'import-file':$('#importFile').value='';$('#importFile').click();break;
    case 'import-paste':openModal('<div class="sh"><h2>📥 Paste backup JSON 粘贴备份</h2><button class="xbtn" data-act="close-modal">×</button></div><textarea class="summary" id="pasteIn" placeholder="Paste JSON here 在此粘贴…"></textarea><div class="foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn pri" data-act="import-go">Validate & Import 验证并导入</button></div>');break;
    case 'import-go':doImport($('#pasteIn').value);break;
    case 'demo-load':askConfirm('Load demo data? 加载演示数据？','This replaces ALL current data with 3 months of sample data. 将覆盖全部现有数据。','Load 加载',true).then(function(ok){if(!ok)return;S=buildDemo();save();ui.month=curMonth();go('home');toast('Demo data loaded ✨');});break;
    case 'reset-all':askConfirm('Reset everything? 全部重置？','All expenses, funds and budget changes will be deleted. Export a backup first! 所有数据将被删除，请先备份。','Reset 重置',true).then(function(ok){if(!ok)return;S=freshData();save();ui.month=curMonth();go('home');toast('Reset to defaults ⟲');});break;
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(F&&t.closest&&t.closest('.expsheet')){if(t.id==='fAmt'||t.getAttribute('data-sf')==='amount'||t.id==='fMer'||t.id==='fNote')updateLive();}
  if(/^fu/.test(t.id||'')&&$('#fuLive'))updateFundLive();
  if(t.id==='expQ'){ui.expFilter.q=t.value;renderExpenses();var q=$('#expQ');q.focus();q.setSelectionRange(q.value.length,q.value.length);}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='monthPicker'&&t.value){setMonth(t.value);return;}
  if(t.id==='importFile'&&t.files&&t.files[0]){var rd=new FileReader();rd.onload=function(){doImport(String(rd.result));};rd.readAsText(t.files[0]);return;}
  if(t.id==='repKey'){ui.repKey=t.value;render();return;}
  if(t.id==='expCat'){ui.expFilter.cat=t.value;renderExpenses();return;}
  if(t.id==='autoTpl'){S.settings.autoTemplate=t.checked;save();render();return;}
  var lf=t.getAttribute('data-lf');
  if(lf){var row=t.closest('[data-line]'),id=row.getAttribute('data-line'),i=lineIdx(id);if(i<0)return;var l=S.months[ui.month].lines[i];
    if(lf==='amount'){var a=parseAmt(t.value);if(!(a>=0)){toast('Invalid amount 金额无效');t.value=l.amount.toFixed(2);return;}l.amount=r2(a);}
    else if(lf==='name'){var nm=t.value.trim();if(!nm){t.value=l.name;return;}l.name=nm;}
    else l[lf]=t.value;
    lineChanged();setTimeout(render,0);return;}
  if(F&&t.closest&&t.closest('.expsheet')){
    if(t.id==='fLine'){readForm();lineDefaults(monthOf(F.date),F.lineId);$('#fCat').value=F.category;$('#fMem').value=F.member;$$('#fPri button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===F.priority);});}
    if(t.id==='fDate'){readForm();var m=monthOf(F.date);$('#fLine').innerHTML=lineOptionsHTML(m,F.lineId,false);$('#splitRows').innerHTML=splitRowsHTML();}
    if(t.id==='fSplit'){readForm();if(F.split&&!F.splits.length){var amt=parseAmt(F.amountStr);F.splits=[{lineId:F.lineId,amount:amt>0?String(amt):''},{lineId:'',amount:''}];}$('#splitRows').innerHTML=splitRowsHTML();$('#singleBox').style.display=F.split?'none':'';$('#splitBox').style.display=F.split?'':'none';}
    updateLive();
  }
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){if($('#confirmLayer').innerHTML)return;if($('#modalLayer').innerHTML){closeModal();F=null;}}if(ev.key==='Enter'&&ev.target.getAttribute&&ev.target.getAttribute('data-lf')){ev.target.blur();}});
window.addEventListener('storage',function(ev){if(ev.key===KEY){S=load();render();}});

/* ===================== INIT ===================== */
function initScene(){
  var sc=Scene.current();
  $('#sceneHost').innerHTML=Scene.build(sc);
  $('#fx').innerHTML=Scene.fx(sc);
  $('#sceneChip').innerHTML=sc!=='none'?'<span class="scenechip">'+esc(Scene.names[sc])+'</span>':'';
  document.body.setAttribute('data-scene',sc);
}
S=load();ensureMonth(ui.month);save();
initScene();render();
window.__app={get S(){return S;},calc:calc,summaryText:summaryText,validate:validate,ui:ui};
})();

</script>
